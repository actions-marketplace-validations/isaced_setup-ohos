name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-minimal:
    name: Test minimal setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OHOS SDK
        uses: ./
        with:
          tools: minimal

      - name: Verify environment
        run: |
          echo "OHOS_SDK=$OHOS_SDK"
          echo "OHOS_NDK_HOME=$OHOS_NDK_HOME"
          echo "OHOS_CMAKE_TOOLCHAIN=$OHOS_CMAKE_TOOLCHAIN"
          test -d "$OHOS_SDK/native/llvm/bin"
          test -f "$OHOS_NDK_HOME/llvm/bin/clang"
          echo "All checks passed!"

  test-lycium-build:
    name: Test lycium build (hello)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OHOS SDK with lycium
        uses: ./
        with:
          lycium: true
          tools: minimal

      - name: Create minimal test package
        run: |
          mkdir -p $LYCIUM_HOME/thirdparty/hello
          cat > $LYCIUM_HOME/thirdparty/hello/HPKBUILD << 'HPK'
          pkgname=hello
          pkgver=1.0.0
          source=""
          packagename=""
          archs=("arm64-v8a")
          depends=()
          buildtools="cmake"
          downloadpackage=false
          autounpack=false
          makedepends=()

          prepare() {
              mkdir -p src
              cat > src/hello.c << 'SRC'
          int hello_ohos(void) { return 42; }
          SRC
              cat > src/hello.h << 'SRC'
          int hello_ohos(void);
          SRC
              cat > src/CMakeLists.txt << 'SRC'
          cmake_minimum_required(VERSION 3.10)
          project(hello C)
          add_library(hello hello.c)
          install(TARGETS hello DESTINATION lib)
          SRC
          }

          # lycium's sure() calls `eval $*`, so build() receives the cmake
          # args already correctly split. Pass them through verbatim with "$@"
          # — do NOT use `eval cmake ../src $*`, which would re-split
          # `-G "Unix Makefiles"` into `-G Unix Makefiles` and break cmake.
          # Each function manages its own cwd and returns to $OLDPWD,
          # matching lycium's own HPKBUILD conventions (see cJSON).
          build() {
              mkdir -p build && cd build
              cmake ../src "$@"
              make -j$(nproc)
              cd "$OLDPWD"
          }

          package() {
              make -C build install
          }

          check() {
              :
          }

          cleanbuild() {
              rm -rf src build
          }
          HPK

      - name: Build hello with lycium
        run: |
          cd $LYCIUM_HOME/lycium
          ./build.sh hello

      - name: Verify build output
        run: |
          echo "=== Checking build artifacts ==="
          find $LYCIUM_HOME/lycium/usr/hello -type f
          test -f "$LYCIUM_HOME/lycium/usr/hello/arm64-v8a/lib/libhello.a" || \
          test -f "$LYCIUM_HOME/lycium/usr/hello/arm64-v8a/lib/libhello.so"
          echo "=== Build record ==="
          cat "$LYCIUM_HOME/lycium/usr/hpk_build.csv"
          grep -i hello "$LYCIUM_HOME/lycium/usr/hpk_build.csv"
          echo "lycium build test passed!"

  test-lycium-build-cjson:
    name: Test lycium build (cJSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OHOS SDK with lycium
        uses: ./
        with:
          lycium: true
          tools: minimal

      - name: Build cJSON with lycium
        run: |
          cd $LYCIUM_HOME/lycium
          ./build.sh cJSON

      - name: Verify build output
        run: |
          echo "=== Checking build artifacts ==="
          find $LYCIUM_HOME/lycium/usr/cJSON -type f
          test -f "$LYCIUM_HOME/lycium/usr/cJSON/arm64-v8a/lib/libcjson.a" -o \
               -f "$LYCIUM_HOME/lycium/usr/cJSON/arm64-v8a/lib/libcjson.so"
          test -d "$LYCIUM_HOME/lycium/usr/cJSON/arm64-v8a/include"
          test -f "$LYCIUM_HOME/lycium/usr/cJSON/arm64-v8a/include/cjson/cJSON.h"
          echo "=== Build record ==="
          cat "$LYCIUM_HOME/lycium/usr/hpk_build.csv"
          grep -i cjson "$LYCIUM_HOME/lycium/usr/hpk_build.csv"
          echo "lycium cJSON build test passed!"

  test-no-tools:
    name: Test with tools=none
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup OHOS SDK (no tools)
        uses: ./
        with:
          tools: none

      - name: Verify environment
        run: |
          test -d "$OHOS_SDK/native"
          echo "SDK-only setup passed!"

  test-hvigor:
    name: Test hvigor (ArkTS build & Local Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup DevEco toolchain (hvigorw/ohpm)
        uses: ./
        with:
          hvigor: true
          lycium: false

      - name: Verify toolchain
        run: |
          echo "OHOS_SDK=$OHOS_SDK"
          echo "OHOS_NDK_HOME=$OHOS_NDK_HOME"
          echo "DEVECO_ROOT=$DEVECO_ROOT"
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          test -x "$DEVECO_ROOT/bin/hvigorw"
          test -x "$DEVECO_ROOT/bin/ohpm"
          test -d "$DEVECO_SDK_HOME/default/openharmony/ets"
          test -d "$OHOS_NDK_HOME/llvm/bin"
          echo "hvigorw: $(hvigorw --version 2>&1 | head -1)"
          echo "ohpm: $(ohpm -v 2>&1 | head -1)"
          echo "toolchain verification passed!"

      - name: Install ohpm dependencies
        working-directory: tests/fixtures/arkts-app
        run: ohpm install

      - name: Run Local Test (unit tests)
        working-directory: tests/fixtures/arkts-app
        run: hvigorw test -p module=entry -p coverage=false

      - name: Build HAP (unsigned debug)
        working-directory: tests/fixtures/arkts-app
        run: hvigorw assembleHap --mode module -p module=entry@default -p buildMode=debug

      - name: Verify build outputs
        working-directory: tests/fixtures/arkts-app
        run: |
          echo "=== Test results ==="
          find entry -path "*intermediates/test*" -name "*.txt" -exec cat {} \; || true
          echo "=== HAP artifacts ==="
          find entry/build -name "*.hap" -type f
          test -n "$(find entry/build -name '*.hap' -type f)"
          echo "hvigor build & test passed!"
